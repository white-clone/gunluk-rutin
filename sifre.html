<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yeni Şifre · Günlük Rutin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tema.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f3eae0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutin">
<style>
  .wrap{max-width:400px;margin:0 auto;padding-block:clamp(24px,8vh,72px) var(--space-8);display:grid;gap:var(--space-6)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--space-4);display:grid;gap:var(--space-4)}
  form{display:grid;gap:var(--space-4)}
  h1{margin:0;font:600 17px/24px var(--font-sans)}
  .muted{margin:0;color:var(--ink-muted);font-size:14px;line-height:20px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ayar.js"></script>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <span class="mark"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="3" height="14" rx="1.5"/><rect x="8.5" y="3" width="3" height="14" rx="1.5"/><rect x="15" y="3" width="3" height="14" rx="1.5"/></svg></span>
    <b>Günlük Rutin</b>
  </div>
  <div class="card">
    <p class="muted" id="wait">Bağlantı kontrol ediliyor…</p>

    <form id="form" novalidate hidden>
      <h1>Yeni şifreni belirle</h1>
      <div class="field"><label for="pw">YENİ ŞİFRE</label><div class="pw"><input id="pw" type="password" autocomplete="new-password" minlength="8" required><button type="button" data-show="pw">Göster</button></div><span class="hint">En az 8 karakter.</span></div>
      <div class="field"><label for="pw2">YENİ ŞİFRE TEKRAR</label><input id="pw2" type="password" autocomplete="new-password" required></div>
      <div class="msg" id="msg" role="alert" hidden></div>
      <button class="btn primary block" type="submit" id="save">Şifreyi kaydet</button>
    </form>

    <div id="invalid" hidden>
      <h1>Bağlantı geçersiz</h1>
      <p class="muted">Sıfırlama bağlantısının süresi dolmuş ya da daha önce kullanılmış. Yeni bir bağlantı iste.</p>
      <p><a class="btn primary block" href="giris.html#unuttum">Yeni bağlantı iste</a></p>
    </div>
  </div>
</main>
<script>
(() => {
const $ = id => document.getElementById(id);
let shown = false;
function showForm() {
  if (shown) return; shown = true;
  $('wait').hidden = true; $('invalid').hidden = true; $('form').hidden = false;
}
function showInvalid() {
  if (shown) return;
  $('wait').hidden = true; $('invalid').hidden = false;
}
function msg(text, kind = 'err') { const el = $('msg'); el.textContent = text; el.className = 'msg ' + kind; el.hidden = !text; }

if (/error=|error_code=/.test(location.hash + location.search)) showInvalid();
sb.auth.onAuthStateChange((event, session) => { if (session) showForm(); });
setTimeout(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) showForm(); else showInvalid();
}, 1200);

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = $('pw').value, pw2 = $('pw2').value;
  if (pw.length < 8) return msg('Şifre en az 8 karakter olmalı.');
  if (pw !== pw2) return msg('Şifreler aynı değil.');
  $('save').disabled = true; $('save').textContent = 'Kaydediliyor…';
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) {
    msg(hataMesaji(error));
    $('save').disabled = false; $('save').textContent = 'Şifreyi kaydet';
    return;
  }
  msg('Şifren değişti. Uygulamaya yönlendiriliyorsun.', 'ok');
  setTimeout(() => location.replace('index.html'), 1500);
});
})();
</script>
</body>
</html>
