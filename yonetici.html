<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yönetici · Günlük Rutin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="tema.css">
<style>
  .wrap{max-width:720px;margin:0 auto;padding-block:var(--space-6) var(--space-8);display:grid;gap:var(--space-4)}
  .hd{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap}
  h1{margin:0;font:600 20px/26px var(--font-display)}
  .eyebrow{margin:0;font:600 12px/16px var(--font-sans);letter-spacing:.06em;color:var(--ink-muted)}
  .tools{display:flex;gap:var(--space-2);flex-wrap:wrap}
  .search{flex:1 1 200px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-pill);padding:10px 16px;min-width:0}
  .search:focus{outline:none;border-color:var(--accent)}
  .stats{display:flex;gap:var(--space-6);flex-wrap:wrap;font-size:14px;color:var(--ink-muted)}
  .stats b{font:500 15px/22px var(--font-mono);color:var(--ink);margin-right:4px}
  .table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
  th{text-align:left;font:600 12px/16px var(--font-sans);letter-spacing:.06em;color:var(--ink-muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  td.name{font-weight:600;white-space:normal;min-width:140px}
  td .abs{display:block;font-size:12px;line-height:16px;color:var(--ink-muted)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--done);margin-right:6px;vertical-align:1px}
  .empty{padding:var(--space-6) var(--space-4);color:var(--ink-muted)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="ayar.js"></script>
</head>
<body>
<main class="wrap">
  <header class="hd">
    <div><p class="eyebrow">YÖNETİCİ</p><h1>Kullanıcılar</h1></div>
    <a class="btn secondary" href="index.html">Uygulamaya dön</a>
  </header>
  <div class="msg err" id="err" role="alert" hidden></div>
  <section id="content" hidden>
    <div style="display:grid;gap:var(--space-4)">
      <div class="stats" id="stats"></div>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="İsimle ara" aria-label="İsimle ara">
        <button class="btn secondary" type="button" id="refresh">Yenile</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Ad soyad</th><th>Son giriş</th><th>Son görülme</th><th>Kayıt</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p class="empty" id="none" hidden>Aramana uyan kullanıcı yok.</p>
      </div>
    </div>
  </section>
  <p class="eyebrow" id="loading">YÜKLENİYOR…</p>
</main>
<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rtf = new Intl.RelativeTimeFormat('tr', { numeric: 'auto' });
const absFmt = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function rel(iso) {
  if (!iso) return '';
  const s = (Date.parse(iso) - Date.now()) / 1000;
  const steps = [[60, 'second'], [3600, 'minute', 60], [86400, 'hour', 3600], [604800, 'day', 86400], [2629800, 'week', 604800], [31557600, 'month', 2629800], [Infinity, 'year', 31557600]];
  for (const [lim, unit, div = 1] of steps) if (Math.abs(s) < lim) return Math.abs(s) < 45 && unit === 'second' ? 'az önce' : rtf.format(Math.round(s / div), unit);
}
const cell = iso => iso ? `${rel(iso)}<span class="abs">${absFmt.format(new Date(iso))}</span>` : '<span class="abs">hiç</span>';
let users = [];

function draw() {
  const q = $('q').value.trim().toLocaleLowerCase('tr');
  const list = users.filter(u => !q || u.full_name.toLocaleLowerCase('tr').includes(q));
  $('rows').innerHTML = list.map(u => {
    const last = Math.max(Date.parse(u.last_sign_in_at || 0) || 0, Date.parse(u.last_seen_at || 0) || 0);
    const active = Date.now() - last < 24 * 3600e3;
    return `<tr><td class="name">${active ? '<span class="dot" title="Son 24 saatte aktif"></span>' : ''}${esc(u.full_name)}</td><td>${cell(u.last_sign_in_at)}</td><td>${cell(u.last_seen_at)}</td><td>${cell(u.created_at)}</td></tr>`;
  }).join('');
  $('none').hidden = list.length > 0;
  const day = users.filter(u => Date.now() - Math.max(Date.parse(u.last_sign_in_at || 0) || 0, Date.parse(u.last_seen_at || 0) || 0) < 24 * 3600e3).length;
  const week = users.filter(u => Date.now() - Math.max(Date.parse(u.last_sign_in_at || 0) || 0, Date.parse(u.last_seen_at || 0) || 0) < 7 * 24 * 3600e3).length;
  $('stats').innerHTML = `<span><b>${users.length}</b>kullanıcı</span><span><b>${day}</b>son 24 saatte aktif</span><span><b>${week}</b>son 7 günde aktif</span>`;
}

async function load() {
  $('refresh').disabled = true;
  const { data, error } = await sb.rpc('yonetici_kullanicilar');
  $('refresh').disabled = false;
  $('loading').hidden = true;
  if (error) {
    $('content').hidden = true;
    $('err').hidden = false;
    $('err').textContent = error.code === '42501' ? 'Bu sayfa yalnızca yönetici hesabıyla açılır.' : hataMesaji(error);
    return;
  }
  users = data || [];
  $('err').hidden = true; $('content').hidden = false;
  draw();
}

sb.auth.getSession().then(({ data }) => {
  if (!data.session) { location.replace('giris.html'); return; }
  load();
});
$('q').addEventListener('input', draw);
$('refresh').addEventListener('click', load);
})();
</script>
</body>
</html>
